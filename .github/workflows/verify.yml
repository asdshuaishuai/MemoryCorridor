name: MemoryCorridor verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install MoonBit toolchain
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Sync the MoonBit registry (dependencies are fetched on demand)
        shell: bash
        run: moon update
      - name: Verify native, WASM, Web and protocol boundaries
        shell: bash
        run: NODE_BINARY=node ./scripts/verify.sh
      - name: Build and verify the Linux native release archive
        shell: bash
        run: |
          python3 scripts/release.py
          python3 scripts/release_e2e.py
      - name: Upload the Linux release archive
        uses: actions/upload-artifact@v4
        with:
          name: memorycorridor-native-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install MoonBit toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://cli.moonbitlang.com/install/powershell.ps1 -OutFile install.ps1
          $env:MOONBIT_INSTALL_VERSION = (Get-Content .moonbit-version -Raw).Trim()
          ./install.ps1
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Sync the MoonBit registry (dependencies are fetched on demand)
        shell: pwsh
        run: moon update
      - name: Check, test and build the native engine on Windows
        shell: pwsh
        run: |
          moon version
          moon check --target native --deny-warn
          moon test --target native
          moon build --target native cli mcp web
      - name: Build and verify the Windows native release archive
        shell: pwsh
        run: |
          python scripts/release.py
          python scripts/release_e2e.py
      - name: Upload the Windows release archive
        uses: actions/upload-artifact@v4
        with:
          name: memorycorridor-native-windows
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  windows-filesystem:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check Windows filesystem adapter syntax
        shell: pwsh
        run: clang-cl /D_WIN32 /Zs platform/fs.c
