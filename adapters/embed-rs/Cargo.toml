[package]
name = "embed-adapter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native host embedding provider for MemoryCorridor's vector subsystem: bge-small-zh-v1.5 ONNX over the same ONNX Runtime OCR uses. No Python."

[dependencies]
# Same ONNX Runtime the OCR adapter already introduced (load-dynamic official
# dylib via ORT_DYLIB_PATH); the pyke static build is avoided for the reason
# documented in adapters/ocr-rs.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde_json = "1"
# Optional multimodal face (续二十六): CLIP ViT-B/32 vision tower on real
# image bytes. Decoder feature set mirrors the engine's image extensions
# (core/entry.mbt: png jpg jpeg gif webp); no tiff there.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# image_sha256 lock: the adapter verifies the bytes it embeds match the exact
# version embedding-plan pinned (defense-in-depth before submit re-validates).
sha2 = "0.10"

[profile.release]
strip = true
lto = true
