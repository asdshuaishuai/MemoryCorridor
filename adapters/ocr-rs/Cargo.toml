[package]
name = "ocr-adapter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native host OCR/PDF text adapter for the MemoryCorridor extraction sidecar channel: one self-contained binary, no Python."

[dependencies]
# load-dynamic: the official runtime is a plain C dylib. build.rs embeds it
# when runtime/ is present; startup extracts it to a private temp file and
# dlopens it. Without runtime/ the adapter falls back to ORT_DYLIB_PATH or a
# sibling dylib. The pyke static "download-binaries" build is avoided: it
# mis-executes the PP-OCRv4 recognition graph on macOS/arm64 (detection is
# fine; every rec output collapses to one token).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
lopdf = "0.36"
flate2 = "1"
serde_json = "1"

[profile.release]
strip = true
lto = true
